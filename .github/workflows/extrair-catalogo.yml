name: Extrair mídias do catálogo STTOREMEN

on:
  push:
    branches: [main]
    paths:
      - "Sttoreman1.zip"
      - ".github/workflows/extrair-catalogo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair imagens, vídeos e demais arquivos do ZIP
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile

          archive = Path("Sttoreman1.zip")
          if not archive.is_file():
              raise SystemExit("Sttoreman1.zip não encontrado na raiz do repositório.")

          destination = Path("assets/importados")
          destination.mkdir(parents=True, exist_ok=True)
          total = 0
          files = []

          try:
              with ZipFile(archive) as z:
                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")
                      path = PurePosixPath(name)
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"Caminho inseguro no ZIP: {name}")
                      if item.is_dir():
                          continue
                      total += item.file_size
                      if total > 500 * 1024 * 1024:
                          raise SystemExit("ZIP excede o limite de 500 MB descompactados.")
                      target = destination.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))
                      files.append((name, item.file_size))
          except BadZipFile:
              raise SystemExit("Sttoreman1.zip não é um arquivo ZIP válido.")

          if not files:
              raise SystemExit("O ZIP não contém arquivos para extrair.")

          print(f"Arquivos extraídos: {len(files)}")
          print(f"Total descompactado: {total} bytes")
          for name, size in files:
              print(f"{size:>10} bytes  {name}")
          PY

      - name: Salvar arquivos extraídos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/importados
          git commit -m "Extrai mídias do catálogo STTOREMEN"
          git push
