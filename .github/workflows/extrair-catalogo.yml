name: Importar atualização do catálogo

on:
  push:
    branches: [main]
    paths:
      - "catalogo-upload.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar e importar arquivos do catálogo
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          from pathlib import Path
          import shutil

          archive = Path("catalogo-upload.zip")
          if not archive.exists():
              raise SystemExit("catalogo-upload.zip não encontrado.")

          staging = Path("/tmp/catalogo-staging")
          staging.mkdir(parents=True, exist_ok=True)
          allowed_products = False
          allowed_images = False

          with ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Caminho inválido no ZIP: {name}")
                  if item.is_dir():
                      continue
                  if name == "products.js":
                      target = staging / "products.js"
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))
                      allowed_products = True
                  elif name.startswith("assets/img/"):
                      relative = PurePosixPath(name).relative_to("assets/img")
                      target = staging / "assets" / "img" / Path(*relative.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))
                      allowed_images = True

          if not (allowed_products or allowed_images):
              raise SystemExit("O ZIP precisa conter products.js e/ou arquivos em assets/img/.")

          if allowed_products:
              shutil.copy2(staging / "products.js", "products.js")
          if allowed_images:
              source = staging / "assets" / "img"
              destination = Path("assets/img")
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copytree(source, destination, dirs_exist_ok=True)
          PY

          rm catalogo-upload.zip

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js assets/img catalogo-upload.zip
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualiza catálogo de produtos"
            git push
          fi
